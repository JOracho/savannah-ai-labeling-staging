name: Build Neon publicforms bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-publicforms.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build bundled function
        run: |
          mkdir -p publicforms-build
          cat > publicforms-build/package.json <<'EOF'
          {
            "type": "module",
            "dependencies": {
              "@neon/functions": "0.11.0",
              "pg": "^8.16.3"
            }
          }
          EOF
          cp publicforms-source.js publicforms-build/index.js
          cd publicforms-build
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          npx --yes esbuild index.js --bundle --platform=node --target=node24 --format=esm --packages=bundle --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" --outfile=index.mjs
          zip -j publicforms.zip index.mjs
      - name: Stage temporary deployment payload
        run: |
          base64 -w0 publicforms-build/publicforms.zip > publicforms-deploy-base64.txt
          mkdir -p .deployment
          cp publicforms-deploy-base64.txt .deployment/publicforms-deploy-base64.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/publicforms-deploy-base64.txt
          git commit -m "Stage temporary publicforms deployment bundle"
          git push
      - name: Upload build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: publicforms-neon-bundle
          path: publicforms-build/publicforms.zip
          retention-days: 3
