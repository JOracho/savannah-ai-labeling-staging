name: Package slyproject for Neon

on:
  push:
    paths:
      - "functions/slyproject/**"
      - ".github/workflows/package-slyproject.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install production dependencies
        working-directory: functions/slyproject
        run: npm install --omit=dev
      - name: Package function
        run: |
          cd functions/slyproject
          zip -qr "$GITHUB_WORKSPACE/slyproject-deployment.zip" index.js package.json node_modules
      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: slyproject-deployment
          path: slyproject-deployment.zip
          retention-days: 1
